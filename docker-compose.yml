services:
  web:
    build: ./web
    environment:
      SITE_DOMAIN: demo.internal
      DATA_DIR: /data
      LIVE_DIR: /certs/live
      RELOAD_DIR: /reload
      NGINX_PROBE_HOST: nginx
      NGINX_PROBE_PORT: "443"
      RECEIPT_TIMEOUT: "6"
      VERIFY_TIMEOUT: "10"
      PENDING_TTL: "45"
      LATE_RELOAD_WAIT: "3"
      STALE_RELOAD_AGE: "15"
    volumes:
      - webdata:/data
      - certs:/certs
      - reload:/reload
    ports:
      - "8080:8000"     # 管理页
    depends_on:
      # 仅要求 nginx 容器已启动：watcher 会等待 web 首次生成证书文件后再启动
      # nginx，若改成等待 healthcheck 会与这一等待互相死锁。
      - nginx

  nginx:
    build: ./nginx
    volumes:
      - certs:/etc/nginx/certs
      - reload:/reload
    ports:
      - "8443:443"      # 内网站点 TLS
      - "8081:80"

volumes:
  webdata:
  certs:
  reload:
